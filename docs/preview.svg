<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img"
     aria-label="Wireframe of the Schedule dialog above the composer strip">
  <style>
    .bg { fill: #0b0b0f; }
    .card { fill: #17171c; stroke: #2b2b33; stroke-width: 1.5; }
    .chipbox { fill: #1d1d24; stroke: #2b2b33; stroke-width: 1.2; }
    .label { fill: #a1a1aa; font: 11px system-ui, sans-serif; }
    .body { fill: #e4e4e7; font: 12px system-ui, sans-serif; }
    .title { fill: #f4f4f5; font: 600 13px system-ui, sans-serif; }
    .hint { fill: #71717a; font: 10.5px system-ui, sans-serif; }
    .orange { fill: #F97316; }
    .onwhite { fill: #ffffff; font: 600 12px system-ui, sans-serif; }
    .stroke { fill: none; stroke: #3f3f46; stroke-width: 1.2; }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="470"/>

  <!-- dialog -->
  <rect class="card" x="170" y="24" width="380" height="226" rx="16"/>
  <text class="title" x="190" y="47">Schedule message</text>
  <path class="stroke" d="M524 40l9 9m0-9-9 9"/>

  <rect class="chipbox" x="190" y="62" width="340" height="42" rx="8"/>
  <text class="body" x="202" y="80">First two lines of the draft…</text>
  <text class="hint" x="202" y="96">2 images · 1 file</text>

  <rect class="chipbox" x="190" y="112" width="72" height="20" rx="10"/>
  <text class="hint" x="202" y="126">In 1 hour</text>
  <rect class="chipbox" x="268" y="112" width="98" height="20" rx="10"/>
  <text class="hint" x="280" y="126">This evening</text>
  <rect class="chipbox" x="372" y="112" width="80" height="20" rx="10"/>
  <text class="hint" x="384" y="126">Tomorrow</text>
  <rect class="chipbox" x="458" y="112" width="72" height="20" rx="10"/>
  <text class="hint" x="470" y="126">Next Mon</text>

  <text class="label" x="190" y="152">Date</text>
  <text class="label" x="318" y="152">Hour</text>
  <text class="label" x="386" y="152">Minute</text>
  <text class="label" x="462" y="152">AM / PM</text>
  <rect class="chipbox" x="190" y="158" width="116" height="30" rx="8"/>
  <text class="body" x="202" y="177">2026-11-14</text>
  <rect class="chipbox" x="318" y="158" width="56" height="30" rx="8"/>
  <text class="body" x="334" y="177">9</text>
  <rect class="chipbox" x="386" y="158" width="58" height="30" rx="8"/>
  <text class="body" x="402" y="177">00</text>
  <rect class="orange" x="462" y="158" width="40" height="30" rx="8"/>
  <text class="onwhite" x="468" y="177">AM</text>
  <rect class="chipbox" x="506" y="158" width="38" height="30" rx="8"/>
  <text class="hint" x="514" y="177">PM</text>

  <text class="hint" x="190" y="203">Sends Fri, 14 Nov, 9:00 am (Hong Kong Time)</text>

  <rect class="stroke" x="190" y="212" width="11" height="11" rx="3"/>
  <text class="label" x="208" y="222">Repeat</text>
  <text class="hint" x="266" y="222">Repeating messages can't include images or files.</text>

  <text class="hint" x="452" y="241">Cancel</text>
  <rect class="orange" x="494" y="228" width="70" height="24" rx="8"/>
  <text class="onwhite" x="508" y="244">Schedule</text>

  <!-- strip -->
  <rect class="chipbox" x="140" y="262" width="440" height="26" rx="8"/>
  <text class="hint" x="156" y="279">⏰ 2 scheduled · next Fri, 14 Nov, 9:00 am</text>
  <text class="hint" x="558" y="279">▸</text>

  <!-- composer -->
  <rect class="card" x="140" y="298" width="440" height="132" rx="14"/>
  <text class="label" x="164" y="324">Message</text>
  <text class="body" x="164" y="346">The draft stays in the composer until it is scheduled.</text>
  <rect class="chipbox" x="164" y="360" width="70" height="24" rx="12"/>
  <text class="hint" x="177" y="376">2 images</text>
  <circle class="stroke" cx="184" cy="406" r="9"/>
  <rect class="chipbox" x="206" y="398" width="62" height="16" rx="8"/>
  <text class="hint" x="216" y="410">Plan</text>
  <rect class="orange" x="452" y="394" width="104" height="26" rx="13"/>
  <text class="onwhite" x="474" y="411">Schedule</text>

  <text class="hint" x="140" y="452">Wireframe only — colours follow the Host theme tokens at runtime.</text>
</svg>
